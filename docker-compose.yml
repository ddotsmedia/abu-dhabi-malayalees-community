version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: admc_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - admc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admc_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:    production
      PORT:        3000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET:  ${JWT_SECRET}
      ADMIN_USER:  ${ADMIN_USER}
      ADMIN_PASS:  ${ADMIN_PASS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - admc_net

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: admc_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - admc_net

volumes:
  pgdata:

networks:
  admc_net:
    driver: bridge
